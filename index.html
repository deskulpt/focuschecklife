    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "FocusCheck",
      "url": "https://adhd-tester.lovable.app",
      "description": "Free online ADHD screening assessment combining DSM-5 questionnaires with cognitive performance tests for children, teens, and adults. Pending clinical trials.",
      "applicationCategory": "HealthApplication",
      "operatingSystem": "Web",
      "offers": [
        { "@type": "Offer", "price": "0", "priceCurrency": "USD", "description": "Free ADHD assessment snapshot" },
        { "@type": "Offer", "price": "5.00", "priceCurrency": "USD", "description": "Full assessment results" },
        { "@type": "Offer", "price": "20.00", "priceCurrency": "USD", "description": "Professional PDF report" }
      ],
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "ratingCount": "1250"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is FocusCheck ADHD assessment?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "FocusCheck is a comprehensive online ADHD screening tool that combines clinically validated questionnaires (based on DSM-5 criteria, ASRS-v1.1, and Conners' Rating Scales) with cognitive performance tests including the Continuous Performance Test, Stroop Color-Word Test, and Working Memory Test."
          }
        },
        {
          "@type": "Question",
          "name": "Is this ADHD test free?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes! The basic assessment including all questionnaires and cognitive games is completely free. You'll receive a results snapshot at no cost. Detailed breakdowns are available for $5, and a professional PDF report for your doctor costs $20."
          }
        },
        {
          "@type": "Question",
          "name": "How long does the ADHD assessment take?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The complete assessment takes approximately 15-20 minutes, including the questionnaire (5-15 minutes depending on age group) and three cognitive performance tests (about 5 minutes total)."
          }
        },
        {
          "@type": "Question",
          "name": "Can this test diagnose ADHD?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "FocusCheck is a screening tool, not a diagnostic instrument. Only a qualified healthcare professional can diagnose ADHD. Our results provide valuable insights and a detailed report you can share with your doctor to support the diagnostic process."
          }
        },
        {
          "@type": "Question",
          "name": "What age groups does FocusCheck support?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "FocusCheck offers age-appropriate assessments for three groups: Children (6-12 years) using Conners' Rating Scales, Teenagers (13-17 years) combining self-report and parent questionnaires, and Adults (18+) using the ASRS-v1.1 scale."
          }
        },
        {
          "@type": "Question",
          "name": "Is my data private and secure?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Absolutely. All assessment data is encrypted and stored securely. Your results are only accessible to you through your authenticated account. We never share personal health data with third parties."
          }
        }
      ]
    }
    </script>
