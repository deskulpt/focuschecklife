    <!-- JSON-LD: WebApplication / MedicalWebPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "FocusCheck ADHD Screening",
      "url": "https://focuscheck.life",
      "description": "Free online ADHD screening assessment combining DSM-5 questionnaires (ASRS, Conners') with cognitive performance tests for children, teens, and adults.",
      "applicationCategory": "HealthApplication",
      "operatingSystem": "Web",
      "browserRequirements": "Requires JavaScript and a modern browser",
      "inLanguage": ["en", "pt-BR"],
      "offers": [
        { "@type": "Offer", "price": "0", "priceCurrency": "USD", "name": "Free ADHD screening snapshot" },
        { "@type": "Offer", "price": "5.00", "priceCurrency": "USD", "name": "Full assessment results" },
        { "@type": "Offer", "price": "12.00", "priceCurrency": "USD", "name": "Professional PDF report" }
      ]
    }
    </script>

    <!-- JSON-LD: FAQPage (AEO / Generative search) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is FocusCheck?",
          "acceptedAnswer": { "@type": "Answer", "text": "FocusCheck is a free online ADHD screening tool that combines clinically informed questionnaires (DSM-5, ASRS-v1.1, Conners') with cognitive performance tests including a Continuous Performance Test, Stroop Color-Word Test, and Working Memory Test. It is a screening aid — not a medical diagnosis." }
        },
        {
          "@type": "Question",
          "name": "Is the ADHD test free?",
          "acceptedAnswer": { "@type": "Answer", "text": "Yes — the basic assessment is completely free and gives you a results snapshot. A full detailed breakdown and a professional PDF report you can take to your doctor are available as one-time paid upgrades." }
        },
        {
          "@type": "Question",
          "name": "How long does the ADHD test take?",
          "acceptedAnswer": { "@type": "Answer", "text": "Most people finish in 15 to 20 minutes — about 5 to 15 minutes for the age-appropriate questionnaire and roughly 5 minutes for the three cognitive performance tests." }
        },
        {
          "@type": "Question",
          "name": "Can FocusCheck diagnose ADHD?",
          "acceptedAnswer": { "@type": "Answer", "text": "No. FocusCheck is a screening tool, not a diagnostic instrument. Only a qualified healthcare professional can diagnose ADHD. Your FocusCheck report is designed to be shared with your clinician to support that conversation." }
        },
        {
          "@type": "Question",
          "name": "What age groups can use FocusCheck?",
          "acceptedAnswer": { "@type": "Answer", "text": "FocusCheck offers age-adapted assessments: children aged 6–12 (parent-mediated, Conners'-style), teenagers 13–17 (self-report plus optional parent input), and adults 18+ (ASRS-v1.1)." }
        },
        {
          "@type": "Question",
          "name": "Is my data private?",
          "acceptedAnswer": { "@type": "Answer", "text": "Yes. Your data is stored securely with row-level encryption, accessible only to your authenticated account, and never sold. You can request deletion at any time." }
        }
      ]
    }
    </script>
